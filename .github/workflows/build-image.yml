# Baut ein ERPNext-Image mit der DATEV-Export-App (alyf-de/erpnext_datev).
# Nur nötig, wenn die Steuerberatung einen DATEV-Export bekommen soll.
# Ohne diesen Weg läuft der Stack mit dem offiziellen frappe/erpnext-Image.
name: build-erpnext-datev-image

on:
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: "Frappe/ERPNext Branch"
        required: true
        default: "version-16"
  push:
    paths:
      - "apps.json"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: apps.json als base64
        id: apps
        run: echo "b64=$(base64 -w 0 apps.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: frappe_docker auschecken
        run: git clone --depth 1 https://github.com/frappe/frappe_docker.git

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fs-erpnext:${{ inputs.frappe_branch || 'version-16' }}
            ghcr.io/${{ github.repository_owner }}/fs-erpnext:${{ github.sha }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ inputs.frappe_branch || 'version-16' }}
            APPS_JSON_BASE64=${{ steps.apps.outputs.b64 }}
