# Baut das ERPNext-Image dieser Instanz: offizielles frappe_docker-Layer-Image
# plus die Apps aus apps.json (erpnext_germany, eu_einvoice, erpnext_datev).
#
# Die Versionen sind bewusst gepinnt, nicht "version-16" (siehe README ->
# "Warum kein latest"). FRAPPE_BRANCH muss zur erpnext-Version in apps.json
# passen: frappe und erpnext haben eigene Patch-Nummern, laufen aber im
# selben Minor. Stand 18.09.2026: frappe v16.34.0 / erpnext v16.35.0 --
# genau das, was auf erp.nak-studis.de laeuft. Ein Update ist damit eine
# bewusste Aenderung an dieser Datei + apps.json, kein stiller Image-Pull.
name: build-erpnext-image

on:
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: "Frappe-Branch oder -Tag (muss zu apps.json passen)"
        required: true
        default: "v16.34.0"
      image_tag:
        description: "Tag des gebauten Images (Konvention: ERPNext-Version)"
        required: true
        default: "v16.35.0"
  push:
    paths:
      - "apps.json"
      - ".github/workflows/build-image.yml"

env:
  DEFAULT_FRAPPE_BRANCH: "v16.34.0"
  DEFAULT_IMAGE_TAG: "v16.35.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Parameter bestimmen
        id: vars
        run: |
          # ghcr.io akzeptiert nur kleingeschriebene Namespaces, der Org-Name
          # hat aber Grossbuchstaben -> hier einmalig kleinschreiben.
          owner="${{ github.repository_owner }}"
          echo "owner=${owner,,}" >> "$GITHUB_OUTPUT"
          echo "frappe_branch=${{ inputs.frappe_branch || env.DEFAULT_FRAPPE_BRANCH }}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ inputs.image_tag || env.DEFAULT_IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
          echo "apps_b64=$(base64 -w 0 apps.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: frappe_docker auschecken
        run: git clone --depth 1 https://github.com/frappe/frappe_docker.git

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/fs-erpnext:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/fs-erpnext:${{ github.sha }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ steps.vars.outputs.frappe_branch }}
            APPS_JSON_BASE64=${{ steps.vars.outputs.apps_b64 }}

      - name: Ergebnis
        run: |
          echo "Image: ghcr.io/${{ steps.vars.outputs.owner }}/fs-erpnext:${{ steps.vars.outputs.image_tag }}"
          echo "Gepinnt auf Commit: ghcr.io/${{ steps.vars.outputs.owner }}/fs-erpnext:${{ github.sha }}"
