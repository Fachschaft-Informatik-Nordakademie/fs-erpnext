name: Backup image

on:
  push:
    branches: [main]
    paths:
      - "backup/**"
      - "tests/**"
      - ".github/workflows/backup-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/test_notify.sh && bash tests/test_verify.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the gitops repo pins the digest of :main; the sha tag is for rollbacks
      - uses: docker/build-push-action@v6
        with:
          context: backup
          push: true
          tags: |
            ghcr.io/fachschaft-informatik-nordakademie/fs-erpnext-backup:${{ github.sha }}
            ghcr.io/fachschaft-informatik-nordakademie/fs-erpnext-backup:main
